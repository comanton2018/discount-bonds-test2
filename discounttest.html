<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f4f7fb" />
  <title>Дисконт-тест</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --surface: #ffffff;
      --surface-soft: #f8fbff;
      --text: #142033;
      --muted: #6b7a90;
      --line: #dce5f0;
      --blue: #1259d5;
      --blue-2: #0c49b8;
      --blue-soft: #eaf2ff;
      --green: #198754;
      --green-soft: #eaf8f0;
      --red: #d64545;
      --red-soft: #fff0f0;
      --shadow: 0 22px 65px rgba(29, 55, 88, 0.10);
      --radius-xl: 24px;
      --radius-lg: 18px;
      --radius-md: 14px;
      --transition: 180ms ease;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--bg);
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(18, 89, 213, 0.07), transparent 36%),
        radial-gradient(circle at bottom right, rgba(55, 126, 236, 0.05), transparent 30%),
        var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    button {
      font: inherit;
    }

    .app-shell {
      width: min(100% - 32px, 880px);
      margin: 0 auto;
      padding: 34px 0 48px;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      margin-bottom: 18px;
      padding: 12px 0 14px;
      background: linear-gradient(to bottom, rgba(244, 247, 251, 0.96) 72%, rgba(244, 247, 251, 0));
      backdrop-filter: blur(12px);
    }

    .topbar-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 10px;
    }

    .brand {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--blue);
    }

    .progress-label {
      font-size: 14px;
      font-weight: 650;
      color: var(--muted);
      white-space: nowrap;
    }

    .progress-track {
      width: 100%;
      height: 7px;
      overflow: hidden;
      border-radius: 999px;
      background: #dfe8f4;
    }

    .progress-fill {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--blue), #367cec);
      transition: width 420ms cubic-bezier(.2, .8, .2, 1);
    }

    .card {
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid rgba(210, 221, 234, 0.9);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .question-view,
    .result-view {
      padding: 34px;
    }

    .question-view {
      animation: enter 320ms ease both;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 5px 10px;
      margin-bottom: 16px;
      border-radius: 999px;
      background: var(--blue-soft);
      color: var(--blue);
      font-size: 12px;
      font-weight: 750;
      letter-spacing: 0.03em;
    }

    h1, h2, p {
      margin-top: 0;
    }

    .question-title {
      margin-bottom: 26px;
      font-size: clamp(24px, 4vw, 34px);
      line-height: 1.22;
      letter-spacing: -0.025em;
      font-weight: 760;
    }

    .answers {
      display: grid;
      gap: 12px;
    }

    .answer {
      position: relative;
      width: 100%;
      min-height: 68px;
      display: grid;
      grid-template-columns: 38px 1fr;
      gap: 12px;
      align-items: center;
      padding: 15px 17px;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: var(--surface);
      color: var(--text);
      text-align: left;
      cursor: pointer;
      transition:
        transform var(--transition),
        border-color var(--transition),
        box-shadow var(--transition),
        background var(--transition);
    }

    .answer:hover:not(:disabled) {
      transform: translateY(-1px);
      border-color: #a8bfdc;
      box-shadow: 0 10px 24px rgba(41, 75, 117, 0.08);
    }

    .answer:focus-visible,
    .primary-btn:focus-visible {
      outline: 3px solid rgba(18, 89, 213, 0.22);
      outline-offset: 2px;
    }

    .answer:disabled {
      cursor: default;
      opacity: 1;
    }

    .answer-letter {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border-radius: 11px;
      background: #f1f5fa;
      color: #4f6177;
      font-weight: 800;
      transition: inherit;
    }

    .answer-text {
      font-size: 16px;
      line-height: 1.42;
      font-weight: 570;
    }

    .answer.correct {
      border-color: rgba(25, 135, 84, 0.55);
      background: var(--green-soft);
      box-shadow: 0 0 0 1px rgba(25, 135, 84, 0.08);
    }

    .answer.correct .answer-letter {
      color: #fff;
      background: var(--green);
    }

    .answer.incorrect {
      border-color: rgba(214, 69, 69, 0.55);
      background: var(--red-soft);
      box-shadow: 0 0 0 1px rgba(214, 69, 69, 0.06);
    }

    .answer.incorrect .answer-letter {
      color: #fff;
      background: var(--red);
    }

    .feedback {
      margin-top: 24px;
      padding: 18px 20px;
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background: var(--surface-soft);
      animation: feedbackIn 280ms ease both;
    }

    .feedback.is-correct {
      border-color: rgba(25, 135, 84, 0.30);
      background: linear-gradient(180deg, #f5fcf8, var(--green-soft));
    }

    .feedback.is-incorrect {
      border-color: rgba(214, 69, 69, 0.26);
      background: linear-gradient(180deg, #fff8f8, var(--red-soft));
    }

    .feedback-status {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      font-size: 18px;
      font-weight: 780;
    }

    .feedback-status::before {
      content: "";
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: currentColor;
      box-shadow: 0 0 0 5px color-mix(in srgb, currentColor 12%, transparent);
    }

    .feedback.is-correct .feedback-status {
      color: var(--green);
    }

    .feedback.is-incorrect .feedback-status {
      color: var(--red);
    }

    .feedback-text {
      margin: 0;
      color: #394a60;
      font-size: 15px;
      line-height: 1.62;
      white-space: pre-line;
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 24px;
    }

    .primary-btn {
      min-width: 190px;
      border: 0;
      border-radius: 14px;
      padding: 14px 20px;
      background: linear-gradient(180deg, #1b64dc, var(--blue));
      color: #fff;
      font-weight: 750;
      cursor: pointer;
      box-shadow: 0 12px 28px rgba(18, 89, 213, 0.20);
      transition: transform var(--transition), box-shadow var(--transition), filter var(--transition);
    }

    .primary-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 15px 32px rgba(18, 89, 213, 0.25);
      filter: brightness(1.02);
    }

    .primary-btn:active {
      transform: translateY(0);
    }

    .result-view {
      text-align: center;
      animation: enter 340ms ease both;
    }

    .result-icon {
      width: 64px;
      height: 64px;
      display: grid;
      place-items: center;
      margin: 0 auto 18px;
      border-radius: 20px;
      background: var(--blue-soft);
      color: var(--blue);
      font-size: 28px;
      font-weight: 850;
    }

    .result-title {
      margin-bottom: 8px;
      font-size: clamp(30px, 6vw, 46px);
      line-height: 1.1;
      letter-spacing: -0.035em;
    }

    .result-rating {
      margin-bottom: 28px;
      color: var(--blue);
      font-size: 18px;
      font-weight: 760;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin: 0 auto 28px;
      max-width: 660px;
    }

    .stat {
      padding: 18px 14px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #fbfdff;
    }

    .stat-value {
      display: block;
      margin-bottom: 5px;
      font-size: 26px;
      font-weight: 820;
      letter-spacing: -0.02em;
    }

    .stat-label {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
    }

    .restart {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      min-width: 210px;
    }

    .hidden {
      display: none !important;
    }

    @keyframes enter {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes feedbackIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 640px) {
      .app-shell {
        width: min(100% - 20px, 880px);
        padding: 18px 0 30px;
      }

      .topbar {
        margin-bottom: 10px;
        padding-top: max(8px, env(safe-area-inset-top));
      }

      .topbar-row {
        margin-bottom: 8px;
      }

      .brand {
        font-size: 11px;
      }

      .progress-label {
        font-size: 13px;
      }

      .question-view,
      .result-view {
        padding: 22px 16px 20px;
      }

      .question-title {
        margin-bottom: 20px;
        font-size: 24px;
      }

      .answer {
        min-height: 62px;
        grid-template-columns: 34px 1fr;
        gap: 10px;
        padding: 13px 12px;
      }

      .answer-letter {
        width: 33px;
        height: 33px;
        border-radius: 10px;
      }

      .answer-text {
        font-size: 15px;
      }

      .feedback {
        margin-top: 18px;
        padding: 16px;
      }

      .actions {
        margin-top: 18px;
      }

      .primary-btn {
        width: 100%;
      }

      .stats {
        grid-template-columns: 1fr;
        gap: 9px;
      }

      .stat {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 14px;
        text-align: left;
        padding: 14px 16px;
      }

      .stat-value {
        margin: 0;
        font-size: 22px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <section class="topbar" aria-label="Прогресс теста">
      <div class="topbar-row">
        <div class="brand">Дисконтные облигации</div>
        <div class="progress-label" id="progressLabel">Вопрос 1 из 15</div>
      </div>
      <div class="progress-track" aria-hidden="true">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </section>

    <section class="card" id="testCard">
      <div class="question-view" id="questionView">
        <div class="eyebrow" id="questionNumber">Вопрос 1</div>
        <h1 class="question-title" id="questionText"></h1>

        <div class="answers" id="answers" role="group" aria-label="Варианты ответа"></div>

        <div class="feedback hidden" id="feedback" aria-live="polite">
          <div class="feedback-status" id="feedbackStatus"></div>
          <p class="feedback-text" id="feedbackText"></p>
        </div>

        <div class="actions">
          <button class="primary-btn hidden" id="nextButton" type="button">
            Следующий вопрос
          </button>
        </div>
      </div>

      <div class="result-view hidden" id="resultView">
        <div class="result-icon">✓</div>
        <h2 class="result-title" id="resultTitle">Результат: 0 из 15</h2>
        <div class="result-rating" id="resultRating"></div>

        <div class="stats" aria-label="Статистика результата">
          <div class="stat">
            <span class="stat-value" id="correctStat">0</span>
            <span class="stat-label">Правильных ответов</span>
          </div>
          <div class="stat">
            <span class="stat-value" id="errorStat">0</span>
            <span class="stat-label">Ошибок</span>
          </div>
          <div class="stat">
            <span class="stat-value" id="percentStat">0%</span>
            <span class="stat-label">Правильных ответов</span>
          </div>
        </div>

        <button class="primary-btn restart" id="restartButton" type="button">
          Пройти тест ещё раз
        </button>
      </div>
    </section>
  </main>

  <script>
    // Все вопросы, варианты, правильные ответы и комментарии собраны здесь.
    // Для редактирования содержания теста достаточно изменить этот массив.
    const quizData = [
      {
        question: "За счёт чего формируется доход инвестора по дисконтной облигации?",
        answers: [
          "За счёт ежемесячного купона",
          "За счёт разницы между ценой приобретения и суммой погашения",
          "За счёт дивидендов Газпромбанка",
          "За счёт начисления процентов брокером"
        ],
        correct: 1,
        explanation: "По облигациям серии 006Р-05Р купонный доход не предусмотрен, доходом является дисконт.",
        feedback: {
          0: "У этой серии нет ежемесячного купона. Нужно запомнить: доход по дисконтной облигации формируется за счёт разницы между ценой приобретения и суммой погашения.",
          2: "Дивиденды относятся к акциям, а не к облигациям. В данном случае доход инвестора — дисконт между ценой покупки и суммой погашения.",
          3: "Брокер не начисляет доход по этой облигации. Источник дохода — разница между ценой приобретения и суммой погашения."
        }
      },
      {
        question: "Кто несёт обязательство по погашению дисконтной облигации Газпромбанка?",
        answers: [
          "ПАО «Газпром»",
          "Российская Федерация",
          "Московская биржа",
          "Банк ГПБ (АО) как эмитент облигации"
        ],
        correct: 3,
        explanation: "Важно: говорить клиенту «Газпром вернёт деньги» неправильно. Эмитент серии 006Р-05Р — именно Банк ГПБ (АО). Закон №39-ФЗ определяет облигацию как ценную бумагу, закрепляющую право владельца получить предусмотренную сумму от эмитента.",
        feedback: {
          0: "ПАО «Газпром» не является эмитентом этой серии. Обязательство несёт Банк ГПБ (АО). Клиенту нельзя говорить «Газпром вернёт деньги».",
          1: "Это корпоративная облигация, а не государственная. Обязательство по погашению несёт эмитент — Банк ГПБ (АО).",
          2: "Московская биржа организует торги, но не является должником по облигации. Обязательство закреплено за эмитентом — Банком ГПБ (АО)."
        }
      },
      {
        question: "Какая формулировка о юридической защите владельца облигации наиболее корректна?",
        answers: [
          "Государство гарантирует возврат номинала по аналогии со вкладом",
          "Выплата гарантирована системой страхования вкладов",
          "Права владельца закреплены законодательством о рынке ценных бумаг и условиями выпуска, но кредитный риск эмитента сохраняется",
          "В случае дефолта Московская биржа выплатит инвестору номинал"
        ],
        correct: 2,
        explanation: "Ключевые нормативные акты — №39-ФЗ «О рынке ценных бумаг» и №46-ФЗ «О защите прав и законных интересов инвесторов на рынке ценных бумаг». Законодательство защищает права инвестора, но не превращает корпоративную облигацию в государственно гарантированный инструмент.",
        feedback: {
          0: "Корпоративная облигация не получает государственную гарантию по аналогии со вкладом. Права инвестора защищаются законом и условиями выпуска, при этом кредитный риск эмитента сохраняется.",
          1: "Система страхования вкладов не является гарантией выплаты по корпоративной облигации. Здесь действуют нормы рынка ценных бумаг и условия выпуска.",
          3: "Московская биржа не обязана выплачивать номинал при дефолте эмитента. Нужно разделять организацию торгов и обязательства самого эмитента."
        }
      },
      {
        question: "С какой суммы в общем случае рассчитывается НДФЛ при погашении дисконтной облигации?",
        answers: [
          "Со всей суммы, полученной при погашении",
          "Только с номинала облигации",
          "С финансового результата: доходы минус соответствующие документально подтверждённые расходы",
          "Налог по дисконтным облигациям отсутствует"
        ],
        correct: 2,
        explanation: "Пример: облигация куплена за 565 ₽ и погашена за 1 000 ₽. Экономический результат составляет 435 ₽ до учёта иных применимых расходов и налоговых особенностей. Налоговая база по операциям с ценными бумагами определяется с учётом финансового результата.",
        feedback: {
          0: "НДФЛ в общем случае рассчитывается не со всей суммы погашения, а с финансового результата с учётом соответствующих подтверждённых расходов.",
          1: "Номинал сам по себе не является налоговой базой. Важен финансовый результат операции: доходы минус соответствующие документально подтверждённые расходы.",
          3: "Дисконтные облигации не освобождены от НДФЛ автоматически. В общем случае налоговая база определяется по финансовому результату."
        }
      },
      {
        question: "Налоговая база клиента по операциям с ценными бумагами за год составила 3 000 000 ₽. Какой порядок ставок НДФЛ применяется для налогового резидента РФ?",
        answers: [
          "Все 3 млн ₽ облагаются по ставке 13%",
          "Все 3 млн ₽ облагаются по ставке 15%",
          "До 2,4 млн ₽ применяется 13%, к превышению применяется 15%",
          "До 5 млн ₽ применяется 13%"
        ],
        correct: 2,
        explanation: "Расчёт:\n\n2 400 000 × 13% = 312 000 ₽\n600 000 × 15% = 90 000 ₽\n\nИтого: 402 000 ₽ НДФЛ.\n\nДля соответствующих налоговых баз по операциям с ценными бумагами действует отдельная шкала: 13% в пределах 2,4 млн ₽ и 15% с превышения.",
        feedback: {
          0: "Ставка 13% применяется только в пределах 2,4 млн ₽ соответствующей налоговой базы. Превышение облагается по ставке 15%.",
          1: "15% не применяется ко всей сумме. До 2,4 млн ₽ действует 13%, а 15% — только к превышению.",
          3: "В этом вопросе порог составляет 2,4 млн ₽, а не 5 млн ₽. К сумме превышения применяется ставка 15%."
        }
      },
      {
        question: "Как работает льгота долгосрочного владения ценными бумагами?",
        answers: [
          "Она действует только по государственным облигациям",
          "Она позволяет уменьшить налогооблагаемый доход при соблюдении требований к сроку владения и самой ценной бумаге",
          "Она освобождает от НДФЛ все доходы по брокерскому счёту после трёх лет его существования",
          "Она распространяется только на купонный доход"
        ],
        correct: 1,
        explanation: "При реализации или погашении обращающихся на организованном рынке ценных бумаг, находившихся в собственности более трёх лет, может применяться инвестиционный налоговый вычет при соблюдении установленных условий.\n\nПредельный размер вычета связан со сроком владения: 3 млн ₽ × количество лет владения.",

    const state = {
      currentIndex: 0,
      score: 0,
      answered: false,
      selectedAnswers: []
    };

    const elements = {
      questionView: document.getElementById("questionView"),
      resultView: document.getElementById("resultView"),
      questionNumber: document.getElementById("questionNumber"),
      questionText: document.getElementById("questionText"),
      answers: document.getElementById("answers"),
      feedback: document.getElementById("feedback"),
      feedbackStatus: document.getElementById("feedbackStatus"),
      feedbackText: document.getElementById("feedbackText"),
      nextButton: document.getElementById("nextButton"),
      restartButton: document.getElementById("restartButton"),
      progressLabel: document.getElementById("progressLabel"),
      progressFill: document.getElementById("progressFill"),
      resultTitle: document.getElementById("resultTitle"),
      resultRating: document.getElementById("resultRating"),
      correctStat: document.getElementById("correctStat"),
      errorStat: document.getElementById("errorStat"),
      percentStat: document.getElementById("percentStat")
    };

    const answerLetters = ["А", "Б", "В", "Г"];

    function renderQuestion() {
      const item = quizData[state.currentIndex];
      state.answered = false;

      elements.questionView.classList.remove("hidden");
      elements.resultView.classList.add("hidden");
      elements.feedback.className = "feedback hidden";
      elements.feedbackStatus.textContent = "";
      elements.feedbackText.textContent = "";
      elements.nextButton.classList.add("hidden");

      const humanIndex = state.currentIndex + 1;
      const total = quizData.length;

      elements.progressLabel.textContent = `Вопрос ${humanIndex} из ${total}`;
      elements.questionNumber.textContent = `Вопрос ${humanIndex}`;
      elements.questionText.textContent = item.question;

      // Progress показывает позицию пользователя в тесте.
      const progressPercent = (humanIndex / total) * 100;
      elements.progressFill.style.width = `${progressPercent}%`;

      elements.answers.innerHTML = "";

      item.answers.forEach((answerText, answerIndex) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "answer";
        button.dataset.index = answerIndex;
        button.setAttribute("aria-label", `${answerLetters[answerIndex]}. ${answerText}`);

        const letter = document.createElement("span");
        letter.className = "answer-letter";
        letter.textContent = answerLetters[answerIndex];

        const text = document.createElement("span");
        text.className = "answer-text";
        text.textContent = answerText;

        button.append(letter, text);
        button.addEventListener("click", () => selectAnswer(answerIndex));
        elements.answers.appendChild(button);
      });

      elements.nextButton.textContent =
        state.currentIndex === total - 1 ? "Завершить тест" : "Следующий вопрос";

      // Повторно запускаем лёгкую анимацию появления карточки вопроса.
      elements.questionView.style.animation = "none";
      void elements.questionView.offsetWidth;
      elements.questionView.style.animation = "";
    }

    function selectAnswer(selectedIndex) {
      if (state.answered) return;

      state.answered = true;
      state.selectedAnswers[state.currentIndex] = selectedIndex;

      const item = quizData[state.currentIndex];
      const isCorrect = selectedIndex === item.correct;
      const answerButtons = [...elements.answers.querySelectorAll(".answer")];

      answerButtons.forEach((button, index) => {
        button.disabled = true;

        if (index === item.correct) {
          button.classList.add("correct");
        }

        if (index === selectedIndex && !isCorrect) {
          button.classList.add("incorrect");
        }
      });

      if (isCorrect) {
        state.score += 1;
        elements.feedback.className = "feedback is-correct";
        elements.feedbackStatus.textContent = "Верно";
        elements.feedbackText.textContent = item.explanation;
      } else {
        elements.feedback.className = "feedback is-incorrect";
        elements.feedbackStatus.textContent = "Неверно";

        const specificFeedback =
          item.feedback && item.feedback[selectedIndex]
            ? item.feedback[selectedIndex]
            : "Выбранный вариант неверен.";

        elements.feedbackText.textContent =
          `${specificFeedback}\n\nПравильный ответ: ${answerLetters[item.correct]}. ${item.answers[item.correct]}\n\n${item.explanation}`;
      }

      elements.nextButton.classList.remove("hidden");
      elements.nextButton.focus({ preventScroll: true });

      window.setTimeout(() => {
        elements.feedback.scrollIntoView({ behavior: "smooth", block: "nearest" });
      }, 70);
    }

    function goNext() {
      if (!state.answered) return;

      if (state.currentIndex < quizData.length - 1) {
        state.currentIndex += 1;
        renderQuestion();
        window.scrollTo({ top: 0, behavior: "smooth" });
      } else {
        showResults();
      }
    }

    function getRating(percent) {
      if (percent >= 90) return "Отличный результат";
      if (percent >= 75) return "Хороший результат";
      if (percent >= 60) return "Материал стоит повторить";
      return "Рекомендуется повторно пройти обучение";
    }

    function showResults() {
      const total = quizData.length;
      const errors = total - state.score;
      const percent = Math.round((state.score / total) * 100);

      elements.questionView.classList.add("hidden");
      elements.resultView.classList.remove("hidden");

      elements.progressLabel.textContent = `Тест завершён · ${total} из ${total}`;
      elements.progressFill.style.width = "100%";

      elements.resultTitle.textContent = `Результат: ${state.score} из ${total}`;
      elements.resultRating.textContent = getRating(percent);
      elements.correctStat.textContent = state.score;
      elements.errorStat.textContent = errors;
      elements.percentStat.textContent = `${percent}%`;

      elements.resultView.style.animation = "none";
      void elements.resultView.offsetWidth;
      elements.resultView.style.animation = "";

      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function restartQuiz() {
      state.currentIndex = 0;
      state.score = 0;
      state.answered = false;
      state.selectedAnswers = [];

      renderQuestion();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    elements.nextButton.addEventListener("click", goNext);
    elements.restartButton.addEventListener("click", restartQuiz);

    renderQuestion();
  </script>
